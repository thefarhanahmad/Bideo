version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bideo-backend
    restart: always
    ports:
      # Option A: Expose backend to localhost so host Nginx can proxy to it.
      # If using Option B (fully containerized), you can leave this or keep it.
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount local upload directory for host visibility and database persistence
      - ./backend/uploads:/app/uploads
    networks:
      - bideo-network

  # Option B: Run frontend container (Nginx serving static frontend + reverse proxying /api)
  # Uncomment the lines below if you want a FULLY containerized setup in Docker.
  # If you prefer to keep Nginx running on the host VPS (Option A), leave this commented.
  # 
  # frontend:
  #   build:
  #     context: ./adminDashboard
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_URL=https://bideo.in/api
  #   container_name: bideo-frontend
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     # Mount SSL certificates from the host VPS
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #     # Mount the production Nginx config with SSL configuration
  #     - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - bideo-network

networks:
  bideo-network:
    driver: bridge
